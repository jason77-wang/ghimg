name: "Copilot Setup Steps"

# Run automatically when this file changes so you can validate it,
# and allow manual runs from the repository's "Actions" tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be named `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    # Keep permissions minimal; Copilot gets its own token for its work.
    permissions:
      contents: read
    timeout-minutes: 30 # maximum allowed value is 59
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            fakeroot \
            gawk \
            git \
            libncurses-dev \
            schroot \
            sbuild \
            ubuntu-dev-tools \
            wget

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install cranky
        env:
          UV_INDEX_KERNEL_USERNAME: ${{ secrets.KERNEL_FORGEJO_USER }}
          UV_INDEX_KERNEL_PASSWORD: ${{ secrets.KERNEL_FORGEJO_TOKEN }}
        run: |
          echo "user length: ${#UV_INDEX_KERNEL_USERNAME}"
          echo "token length: ${#UV_INDEX_KERNEL_PASSWORD}"
          uv tool install --index kernel=https://kernel.ubuntu.com/forgejo/api/packages/kernel/pypi/simple/ cranky

      - name: Add uv tools to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure ~/.bashrc
        run: |
          cat >> "$HOME/.bashrc" << 'EOF'

          # Set System Locale to enable scripts handling ABI files to make sure that
          # these files are not unnecessarily reordered.
          export LC_ALL=C.UTF-8

          # Helper to call debian/rules quickly
          alias fdr="fakeroot debian/rules"

          # Set shell variables so various Debian maintenance tools know your real name
          # and email address to use for packages
          export DEBEMAIL="hui.wang@canonical.com" # TODO
          export DEBFULLNAME="Hui Wang" # TODO
          EOF

      - name: Configure cranky
        run: |
          mkdir -p "$HOME/.config/cranky"
          cat > "$HOME/.config/cranky/cranky.yaml" << 'EOF'
          # Configuration file for the cranky toolchain.
          #
          # Copy to ~/.config/cranky/cranky.yaml and modify as you like. Note that a
          # configuration file is not necessary since all options can also be specified
          # using commandline arguments. Commandline arguments take precedence over
          # options specified in this file.
          #

          # Absolute base path for all the bits managed by the cranky tools. The repos,
          # logs, ...
          #
          # All paths below are relative to this 'base-path':
          #
          base-path: '~/canonical/kernel/ubuntu'

          # cranky checkout
          #checkout:
            # A local reference kernel repo used for cloning the Ubuntu kernel repo.
            # Using this speeds up the cloning process considerably. See
            # 'git help clone', option --reference, for more details.
            #reference: /path/to/local/kernel/repo
            # Borrow the objects from the above reference repo only during the cloning
            # process to reduce network traffic. See 'git help clone', option
            # --dissociate, for more details.
            #dissociate: True

          # cranky test-build
          #test-build:
            # The relative path of the directory where the logfiles are written to.
            #log-path: relative/path/to/logdir

          # cranky review-master-changes
          #review-master-changes:
            # Extended regular expression to exclude commits based on the commit message
            #exclude: "UBUNTU: (Ubuntu-|link-to-tracker:|Start new release)"
            # Command used to list the master kernel commits
            #git-cmd: "git log --oneline"

          # Feature flags
          feature:
            # If this installation of cranky will be used in auto-prepare, set to true here:
            auto-prepare: false

          # Path to source code directories
          #
          # The relative paths to the git repos of the different packages. The paths can
          # be specified per package type (main, meta, signed) or via a 'default' entry
          # which is used as a fallback. The following formatter keywords are
          # recognized:
          #   {series}:      The distro series codename (bionic, ...)
          #   {type}:        The type of the package (main, meta, signed, ...)
          #   {type_suffix}: The suffix of dependent packages (-meta, -signed, ...)
          #   {package}:     The package name (linux, linux-aws, linux-meta-gcp, ...)
          #   {source}:      The source name (linux-oracle, linux-restricted-modules-oracle, ...)
          #
          # The following configuration assumes you are going to use the following
          # layout:
          #
          #  $HOME/canonical/kernel/ubuntu/<ubuntu_release>/<kernel_version>
          #
          package-path:
            default: '{series}/{source}/linux-{type}'
          EOF

      - name: Verify cranky
        run: |
          which cranky
          cranky --help

      - name: Set up sbuild
        run: |
          # Ensure the runner is a member of the sbuild group.
          sudo usermod -aG sbuild "$USER"
          # Pre-create ~/.sbuildrc so mk-sbuild's first run does not open an
          # interactive editor (which hangs in CI with no terminal).
          touch "$HOME/.sbuildrc"

          # The 'resolute' series is too new for the runner's debootstrap, so it
          # has no matching script. mk-sbuild falls back to a generic 'gutsy'
          # script that may be absent on recent debootstrap, causing
          # "Specified release (gutsy) not known to debootstrap". Provide a
          # debootstrap script for the series by linking it to an available
          # generic Ubuntu script, and tell mk-sbuild to use it.
          scripts=/usr/share/debootstrap/scripts
          base=
          for c in gutsy noble jammy focal edgy feisty dapper; do
            if [ -f "$scripts/$c" ]; then base=$c; break; fi
          done
          if [ -n "$base" ] && [ ! -e "$scripts/resolute" ]; then
            sudo ln -s "$base" "$scripts/resolute"
          fi
          echo "DEBOOTSTRAP_SCRIPT=resolute" > "$HOME/.mk-sbuild.rc"

      - name: Create base chroot
        run: sg sbuild -c "EDITOR=true cranky chroot create-base resolute:linux"

      - name: Create session chroot
        run: sg sbuild -c "EDITOR=true cranky chroot create-session resolute:linux"
